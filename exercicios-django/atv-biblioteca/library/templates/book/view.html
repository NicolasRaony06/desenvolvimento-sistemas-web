{% extends "base.html" %}

{% block title %}Listar Livros{% endblock title %}

{% block body %}
<div class="container">
    <h1>Livros</h1>
    <a href="{% url "library:register_book" %}" class="btn btn-primary">Novo Livro</a>
    <a href="{% url "library:register_author" %}" class="btn btn-secondary">Novo Autor</a>
    <br>
    <br>
    <div class="container row">
        {% for book in books %}
        <div class="card" style="width: 12rem;">
          <div class="card-body">
            <h5 class="card-title">{{book.title}}</h5>
            {% for author in book.authors.all %}
              <h6 class="card-subtitle"><a href="{% url "library:view_author_detailed" author.id %}">{{author}}</a></h6>
            {% endfor %}  
            <h6 class="card-subtitle"><a href="{% url "library:edit_book" book.id %}">Editar</a></h6>
            <h6 class="card-subtitle">{{book.published_year}}</h6>
          </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock body %}
