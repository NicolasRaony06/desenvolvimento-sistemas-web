{% extends "base.html" %}

{% block title %}Listar Livros{% endblock title %}

{% block body %}
<div class="container">
    <h1>Livros</h1>
    <a href="{% url "library:register_book" %}" class="btn btn-primary">Cadastrar Livro</a>
    <br>
    <br>
    <div class="container row">
        {% for book in books %}
        <div class="card" style="width: 12rem;">
          <div class="card-body">
            <h5 class="card-title">{{book.tittle}}</h5>
            <h6 class="card-subtitle"><a href="{% url "library:view_author_detailed" book.author.id %}">{{book.author}}</a></h6>
            <h6 class="card-subtitle">{{book.published_year}}</h6>
          </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock body %}
